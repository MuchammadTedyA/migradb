[package]
name = "migration-engine-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "migration_engine_napi"

[dependencies]
napi = { version = "2.14", features = ["napi4"] }
napi-derive = "2.14"
migration-engine = { path = ".." }

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
