[package]
name = "migration-engine"
version = "0.1.1"
edition = "2021"
authors = ["Muchammad Tedy"]
description = "Core migration engine for SQL database migrations"

[lib]
crate-type = ["cdylib", "rlib"]
name = "migration_engine"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
thiserror = "1.0"
log = "0.4"
simple_logger = "4.3"
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "migradb"
path = "src/bin/main.rs"

[dev-dependencies]
tempfile = "3.8"

[workspace]
members = ["npm", "python"]
