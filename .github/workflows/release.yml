name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  # -------------------------------------------------------------------------
  # 1. Build Native Rust Shared Libraries (for Go & C FFI users)
  # -------------------------------------------------------------------------
  build-rust-binaries:
    name: Build Native Engine (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_path: target/release/migration_engine.dll
            asset_name: migration_engine-windows-x64.dll
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_path: target/release/libmigration_engine.so
            asset_name: libmigration_engine-linux-x64.so
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_path: target/release/libmigration_engine.dylib
            asset_name: libmigration_engine-macos-x64.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_path: target/aarch64-apple-darwin/release/libmigration_engine.dylib
            asset_name: libmigration_engine-macos-arm64.dylib

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build shared library
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.binary_path }}

  # -------------------------------------------------------------------------
  # 2. Build & Publish Python Wheels (PyPI)
  # -------------------------------------------------------------------------
  build-python-wheels:
    name: Build Python Wheels (${{ matrix.os }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: windows-latest
            target: x86_64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheels via maturin-action
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          working-directory: python
          args: --release --out dist

      - name: Build sdist
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: python
          args: --out dist

      - name: Upload Python wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist

      - name: Publish to PyPI (if PYPI_API_TOKEN is set)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAVE_PYPI_TOKEN != ''
        env:
          HAVE_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install maturin
          maturin upload --skip-existing python/dist/*

  # -------------------------------------------------------------------------
  # 3. Build & Publish Node.js Package (npm)
  # -------------------------------------------------------------------------
  build-npm-package:
    name: Build Node.js Addon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: npm/package.json

      - name: Install dependencies
        working-directory: npm
        run: npm ci || npm install

      - name: Build napi binary
        working-directory: npm
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
          RUSTFLAGS: '-C link-arg=-undefined -C link-arg=dynamic_lookup'
        run: npm run build

      - name: Upload npm build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-addon-${{ matrix.os }}
          path: npm/*.node
        continue-on-error: true

      - name: Publish to npm (if NPM_TOKEN is set)
        if: matrix.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/v') && env.HAVE_NPM_TOKEN != ''
        working-directory: npm
        env:
          HAVE_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public

  # -------------------------------------------------------------------------
  # 4. Create GitHub Release & Attach Binaries
  # -------------------------------------------------------------------------
  create-github-release:
    name: Create GitHub Release
    needs: [build-rust-binaries, build-python-wheels, build-npm-package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten release assets
        run: |
          mkdir -p dist-release
          find release-assets -type f -exec cp {} dist-release/ \;
          ls -la dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MigrDB ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-release/*

