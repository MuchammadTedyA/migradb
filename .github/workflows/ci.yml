name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust-tests:
    name: Rust Core Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        run: cargo test --verbose

  go-tests:
    name: Go Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: go/go.mod

      - name: Build Rust core library
        run: cargo build --release

      - name: Run Go tests (Windows Zero-CGO)
        if: runner.os == 'Windows'
        run: |
          cd go
          go test -v ./...

      - name: Run Go tests (Linux CGO)
        if: runner.os == 'Linux'
        run: |
          export LD_LIBRARY_PATH=$PWD/target/release:$LD_LIBRARY_PATH
          cd go
          go test -v ./...

